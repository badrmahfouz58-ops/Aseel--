<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أسيل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
:root{
  --glass:rgba(255,255,255,.10);
  --glass-b:rgba(255,255,255,.22);
  --soft:#f3d6e0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',sans-serif;
  color:#fbeff4;
  min-height:100vh;
  overflow-x:hidden;
  background:#3a2236;
}
.hidden{display:none !important}

/* ===== خلفية هادية ===== */
.bg-gradient{
  position:fixed;inset:0;z-index:-3;
  background:linear-gradient(135deg,#b9788f,#8b5a7c,#5b4a78,#a36883);
  background-size:300% 300%;
  animation:bgMove 40s ease infinite;
}
@keyframes bgMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.stars{position:fixed;inset:0;z-index:-2;pointer-events:none}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
  animation:twinkle 6s infinite ease-in-out;opacity:.15;
}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.55}}

.hearts-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fheart{
  position:absolute;bottom:-40px;
  animation:floatUp linear forwards;
}
.fheart svg{display:block;width:100%;height:100%}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0);opacity:0}
  15%{opacity:.4}
  100%{transform:translateY(-115vh) translateX(-20px);opacity:0}
}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ===== شاشة البداية ===== */
.intro{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  text-align:center;padding:20px;
  background:radial-gradient(circle at center,rgba(139,90,124,.55),rgba(42,26,40,.96));
  backdrop-filter:blur(6px);
  transition:opacity 1.1s, transform 1.1s;
}
.intro.leave{opacity:0;transform:scale(1.08);pointer-events:none}
.envelope{
  width:130px;height:130px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.07);
  border:1px solid var(--glass-b);
  animation:beat 3.2s ease-in-out infinite;
}
.envelope svg{width:56px;fill:var(--soft);opacity:.95}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.intro-title{font-family:'Aref Ruqaa',serif;font-weight:400;font-size:clamp(28px,6vw,44px);color:var(--soft)}
.intro-title span{color:#fff}

/* ===== أزرار ===== */
.btn{
  font-family:inherit;font-weight:600;font-size:18px;
  border:1px solid var(--glass-b);border-radius:50px;padding:13px 38px;cursor:pointer;
  color:#fff;background:rgba(255,255,255,.12);
  transition:background .4s, transform .4s;
}
.btn:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}

/* ===== Hero ===== */
.main{position:relative;z-index:1;animation:fadeIn 1.6s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
section{padding:70px 18px;max-width:900px;margin:auto}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.big-heart{width:96px;animation:beat 3.2s ease-in-out infinite;cursor:pointer}
.big-heart svg{width:100%;fill:#e8a5bc;filter:drop-shadow(0 0 14px rgba(232,165,188,.45))}
.occasion{letter-spacing:5px;font-weight:600;color:var(--soft);padding:6px 22px;border-radius:30px;border:1px solid var(--glass-b)}
.hero-title{font-family:'Aref Ruqaa',serif;font-weight:400;font-size:clamp(52px,14vw,110px);line-height:1.3;color:#fff}
.scroll-down{margin-top:36px;opacity:.7;font-size:15px;animation:bounce 3s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* ===== كروت ===== */
.glass{
  background:var(--glass);
  border:1px solid var(--glass-b);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:26px;
  box-shadow:0 16px 44px rgba(0,0,0,.18);
}
.card{padding:46px 26px;text-align:center}
.sec-title{font-family:'Aref Ruqaa',serif;font-weight:400;font-size:clamp(26px,5vw,38px);margin-bottom:26px;text-align:center}

/* ظهور عند التمرير */
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.6s ease, transform 1.6s ease}
.reveal.show{opacity:1;transform:none}

/* ===== الجملة ===== */
.special .card{padding:60px 22px}
.small-line{font-size:18px;opacity:.85;margin:8px 0 18px}
.love-line{font-family:'Aref Ruqaa',serif;font-weight:400;font-size:clamp(28px,6vw,48px);line-height:2}
.love-line .w{display:inline-block;opacity:0;transform:translateY(14px);margin:0 5px}
.love-line.play .w{animation:wordIn 1s ease forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
.love-line .big{font-size:1.25em;color:#fff}
.love-line .glow{color:#f7c6d6;text-shadow:0 0 18px rgba(247,198,214,.45)}

/* ===== الجواب ===== */
.letter{
  background:linear-gradient(160deg,#fff9fb,#f6e4ea);
  color:#6d3550;border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  position:relative;
}
.letter::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(139,70,100,.3);border-radius:8px;pointer-events:none}
.letter .sec-title{color:#8b4664}
.letter-text{font-family:'Aref Ruqaa',serif;font-size:clamp(24px,5.5vw,36px);line-height:2.1;text-align:center;white-space:pre-line;padding:10px 0 16px}
.letter-text .ghost{color:transparent}

.footer{text-align:center;padding:40px 20px 90px;opacity:.75;letter-spacing:1px}

/* ===== الموسيقى ===== */
.music-btn{
  position:fixed;top:14px;left:14px;z-index:70;
  font-family:inherit;font-size:14px;font-weight:600;color:#fff;
  background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 18px;border-radius:30px;cursor:pointer;
}
.music-btn:hover{background:rgba(255,255,255,.2)}
#ytWrap{position:fixed;right:8px;bottom:8px;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1}
#ytWrap iframe{width:200px;height:200px}

@media(max-width:560px){
  section{padding:50px 14px}
}
  </style>
</head>
<body>

  <!-- خلفية -->
  <div class="bg-gradient"></div>
  <div class="stars" id="stars"></div>
  <div class="hearts-layer" id="heartsLayer"></div>
  <canvas id="confetti"></canvas>

  <!-- الأغنية (فيديو يوتيوب مخفي) -->
  <div id="ytWrap"><div id="ytPlayer"></div></div>
  <button class="music-btn hidden" id="musicBtn">إيقاف الموسيقى</button>

  <!-- شاشة البداية -->
  <section id="intro" class="intro">
    <div class="envelope" id="envelope">
      <svg viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
    </div>
    <h1 class="intro-title">في حاجة مستنياكي يا <span id="introNick">لوللتي</span></h1>
    <button class="btn" id="openBtn">دوسي هنا</button>
  </section>

  <main id="main" class="main hidden">

    <!-- Hero -->
    <section class="hero">
      <div class="big-heart" id="bigHeart">
        <svg viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
      </div>
      <p class="occasion">11 / 11</p>
      <h1 class="hero-title">أسيل القلب</h1>
      <div class="scroll-down">انزلي تحت ↓</div>
    </section>

    <!-- الجملة المهمة -->
    <section class="special">
      <div class="card glass reveal">
        <p class="small-line">عايز أقولك حاجة…</p>
        <h2 class="love-line" id="loveLine">
          <span class="w">يمكن</span>
          <span class="w">متكونيش</span>
          <span class="w">أول</span>
          <span class="w">حب</span>
          <span class="w dots">…</span>
          <br>
          <span class="w big">بس</span>
          <span class="w big glow">إنتي</span>
          <span class="w big">أول</span>
          <span class="w big glow">حب</span>
        </h2>
      </div>
    </section>

    <!-- رسالة -->
    <section>
      <div class="card letter reveal">
        <h3 class="sec-title">جواب صغير ليكي</h3>
        <p id="letterText" class="letter-text"></p>
      </div>
    </section>

    <footer class="footer">
      <p>اتعمل لـ <b>حبيبي اللي بحبه</b> &nbsp;•&nbsp; 11 / 11</p>
    </footer>
  </main>

  <script>
/* =========================================
   عدّل من هنا (الإعدادات)
   ========================================= */
const CONFIG = {
  nick: "لوللتي",

  letter: "عمري ما شوفتك واحدة عادية يا أسيل عشان أحبك حب عادي",

  // الأغنية: رابط يوتيوب شورتس
  song: {
    id: "twuvNCu4F2o",
    start: 0,   // ثانية بداية الجزء
    end: 0      // ثانية نهاية الجزء (0 = لحد آخر الفيديو) وبعدها بيعيد من البداية
  }
};

/* =========================================
   أدوات
   ========================================= */
const $ = (s) => document.querySelector(s);
const rand = (a, b) => Math.random() * (b - a) + a;
const HEART_D = "M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z";
const HEART_PATH = new Path2D(HEART_D);
const COLORS = ["#e8a5bc","#f3d6e0","#ffffff","#d98ba3"];

document.getElementById("introNick").textContent = CONFIG.nick;

/* نجوم */
(function makeStars(){
  const box = $("#stars");
  for(let i=0;i<50;i++){
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = rand(0,100)+"%";
    s.style.top = rand(0,100)+"%";
    s.style.animationDelay = rand(0,6)+"s";
    s.style.animationDuration = rand(5,9)+"s";
    box.appendChild(s);
  }
})();

/* قلوب طايرة في الخلفية (قليلة وهادية) */
function spawnHeart(){
  const layer = $("#heartsLayer");
  const h = document.createElement("div");
  h.className = "fheart";
  const size = rand(12,22);
  h.style.width = size+"px";
  h.style.height = (size*0.925)+"px";
  h.style.left = rand(0,100)+"vw";
  const dur = rand(14,20);
  h.style.animationDuration = dur+"s";
  const col = COLORS[Math.floor(Math.random()*COLORS.length)];
  h.innerHTML = `<svg viewBox="0 0 32 29.6"><path fill="${col}" d="${HEART_D}"/></svg>`;
  layer.appendChild(h);
  setTimeout(()=>h.remove(), dur*1000);
}
setInterval(spawnHeart, 3500);

/* =========================================
   Hearts burst (Canvas)
   ========================================= */
const canvas = $("#confetti");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener("resize", resize);

let particles = [];
function burst(x, y, count = 8){
  for(let i=0;i<count;i++){
    const a = rand(0, Math.PI*2), sp = rand(1.5, 5);
    particles.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - 1.5,
      size: rand(10, 20),
      life: rand(70, 110),
      color: COLORS[Math.floor(Math.random()*COLORS.length)]
    });
  }
}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles = particles.filter(p => p.life > 0);
  for(const p of particles){
    p.x += p.vx; p.y += p.vy;
    p.vy += .08;
    p.vx *= .985;
    p.life--;
    ctx.save();
    ctx.globalAlpha = Math.min(.9, p.life/40);
    ctx.translate(p.x - p.size/2, p.y - p.size/2);
    ctx.scale(p.size/32, p.size/32);
    ctx.fillStyle = p.color;
    ctx.fill(HEART_PATH);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
loop();

/* ضغطة على أي مكان = كام قلب */
addEventListener("click", e => burst(e.clientX, e.clientY, 4));

/* =========================================
   الأغنية (YouTube IFrame API)
   ========================================= */
let player = null, playerReady = false, wantPlay = false, endTimer = null;

(function loadYT(){
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();

window.onYouTubeIframeAPIReady = function(){
  const vars = { playsinline:1, controls:0, rel:0, modestbranding:1, disablekb:1, fs:0, start: CONFIG.song.start };
  if(location.protocol.startsWith("http")) vars.origin = location.origin;
  player = new YT.Player("ytPlayer", {
    width: 200, height: 200,
    videoId: CONFIG.song.id,
    playerVars: vars,
    events: {
      onReady: () => { playerReady = true; if(wantPlay) startSong(); },
      onStateChange: (e) => {
        if(e.data === YT.PlayerState.ENDED){ player.seekTo(CONFIG.song.start, true); player.playVideo(); }
      }
    }
  });
};

function startSong(){
  if(!playerReady){ wantPlay = true; return; }
  player.unMute();
  player.setVolume(100);
  player.seekTo(CONFIG.song.start, true);
  player.playVideo();
  clearInterval(endTimer);
  if(CONFIG.song.end > 0){
    endTimer = setInterval(() => {
      if(player.getCurrentTime() >= CONFIG.song.end){ player.seekTo(CONFIG.song.start, true); }
    }, 400);
  }
  $("#musicBtn").textContent = "إيقاف الموسيقى";
}

$("#musicBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  if(!playerReady) return;
  if(player.getPlayerState() === YT.PlayerState.PLAYING){
    player.pauseVideo();
    $("#musicBtn").textContent = "تشغيل الموسيقى";
  } else {
    player.playVideo();
    $("#musicBtn").textContent = "إيقاف الموسيقى";
  }
});

/* =========================================
   فتح الشاشة الأولى
   ========================================= */
$("#openBtn").addEventListener("click", () => {
  const intro = $("#intro");
  const r = $("#openBtn").getBoundingClientRect();
  burst(r.left + r.width/2, r.top, 16);
  startSong();
  $("#musicBtn").classList.remove("hidden");
  intro.classList.add("leave");
  setTimeout(() => {
    intro.classList.add("hidden");
    $("#main").classList.remove("hidden");
    observe();
  }, 1100);
});

/* القلب الكبير */
$("#bigHeart").addEventListener("click", e => burst(e.clientX, e.clientY, 12));

/* =========================================
   الجواب (بيتكتب حرف حرف من غير ما الكارت يتحرك)
   ========================================= */
const letterEl = $("#letterText");
letterEl.innerHTML = `<span class="ghost"></span>`;
letterEl.firstChild.textContent = CONFIG.letter;
let letterDone = false;
function typeLetter(){
  if(letterDone) return; letterDone = true;
  const full = CONFIG.letter; let i = 0;
  letterEl.innerHTML = `<span></span><span class="ghost"></span>`;
  const typed = letterEl.children[0], ghost = letterEl.children[1];
  (function t(){
    i++;
    typed.textContent = full.slice(0, i);
    ghost.textContent = full.slice(i);
    if(i < full.length) setTimeout(t, 70);
  })();
}

/* =========================================
   ظهور عند التمرير
   ========================================= */
function observe(){
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(!en.isIntersecting) return;
      en.target.classList.add("show");
      if(en.target.querySelector("#loveLine")){
        $("#loveLine").classList.add("play");
        document.querySelectorAll("#loveLine .w").forEach((w,i)=> w.style.animationDelay = (i*0.45)+"s");
        setTimeout(()=> burst(innerWidth/2, innerHeight/2, 16), 3600);
      }
      if(en.target.classList.contains("letter")) typeLetter();
      io.unobserve(en.target);
    });
  }, {threshold:.25});
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
}
  </script>
</body>
</html>
